<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you~ — text animation</title>
<meta name="description" content="A message that writes itself, one letter at a time, assembled from a field of ASCII glyphs. An original animation by @nummbee01.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080a'/%3E%3Ctext x='4' y='23' font-family='monospace' font-size='20' fill='%237ef0c0'%3E@%3C/text%3E%3C/svg%3E">
<style>
  :root{ --bg:#07080a; --ink:#e8edf2; --mute:#8a94a3; --mint:#7ef0c0; --pink:#ff8fc7; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(60rem 40rem at 18% -12%, rgba(126,240,192,.12), transparent 62%),
      radial-gradient(52rem 36rem at 92% 112%, rgba(255,143,199,.12), transparent 62%),
      radial-gradient(46rem 24rem at 50% 52%, rgba(126,240,192,.055), transparent 70%);
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  #c{position:fixed; inset:0; width:100%; height:100%; display:block}
  .hud{position:fixed; top:22px; left:24px; z-index:2; pointer-events:none}
  .hud b{display:block; font-size:12px; letter-spacing:.16em; color:var(--pink); font-weight:600}
  .hud span{font-size:12px; color:var(--mute)}
  .hud a{color:var(--mint); text-decoration:none; pointer-events:auto}
  .hud a:hover{text-decoration:underline}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<p class="sr">A message that writes itself one letter at a time: Я тебя люблю. Я жить без тебя не могу~. Hover to open a black hole and hold to grow it. Then a diamond ring appears and asks: Ты выйдешь за меня замуж?</p>
<div class="hud">
  <b>For you~</b>
  <span>a message by <a href="https://github.com/nummbee01">@nummbee01</a> · hover: black hole · hold: grow</span>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TEXT = 'Я тебя люблю. Я жить без тебя не могу~';
  const ASK = 'Ты выйдешь за меня замуж?';
  const STEP_MS = 1000;
  const ASK_MS = 110;
  const HOLD_MS = 6000;
  const OUT_MS = 500;
  const RAMP = '#%@&$BQ08';
  const DUST_RAMP = '.,:;+*';
  const PETAL_RAMP = '❀✿*';
  const SPARK_RAMP = '*+·';
  const FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const MAX_PARTICLES = 6000;

  let W = 0, H = 0, DPR = 1, particles = [], dust = [], stars = [], sparks = [], hearts = [], flutter = [], petals = [];
  let typingStart = 0, typingEnd = 0, holdUntil = Infinity, disappearStart = Infinity;
  let letters = [], sparkCursor = 0, burstDone = true, prevNow = 0, nextAmbient = 0;
  let phase = 'message', ringParts = [], ringS = 1, ringCy = 0, ringMidY = 0, ringOuter = 1;
  let gem = { x: 0, y: 0, r: 0 }, orbitSparks = [];
  let gemBurstAt = -Infinity, gemBurstDone = true, flashAt = -Infinity;
  let nextGemSpark = -Infinity, nextGemHeart = -Infinity, nextRingSpark = 0, nextBigHeart = 0, nextHeroHeart = 0, bigHearts = [];
  const mouse = { x: -1e4, y: -1e4 };
  let pointerIn = false, pressing = false, holeR = 16, pressAt = 0, meteor = null, nextMeteor = 0;

  const font = (s) => `900 ${s}px ${SANS}`;
  const STOPS = [[126, 240, 192], [255, 241, 208], [255, 143, 199]];

  function colorAt(t) {
    t = Math.max(0, Math.min(1, t));
    const seg = t * (STOPS.length - 1);
    const i = Math.min(STOPS.length - 2, Math.floor(seg));
    const f = seg - i;
    const a = STOPS[i], b = STOPS[i + 1];
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)}, ${Math.round(a[1] + (b[1] - a[1]) * f)}, ${Math.round(a[2] + (b[2] - a[2]) * f)})`;
  }

  function linesOf(text, maxChars) {
    const sentences = text.replace(/([.!?…])\s+/g, '$1\n').split('\n');
    const lines = [];
    for (const sentence of sentences) {
      const s = sentence.trim();
      if (!s) continue;
      if (s.length <= maxChars) { lines.push(s); continue; }
      let line = '';
      for (const word of s.split(/\s+/)) {
        if (line && (line + ' ' + word).length > maxChars) { lines.push(line); line = word; }
        else line = line ? line + ' ' + word : word;
      }
      if (line) lines.push(line);
    }
    return lines;
  }

  function sampleText(text, opts) {
    const o2 = opts || {};
    const maxChars = o2.maxChars || (W < 720 ? 18 : 30);
    const maxW = o2.maxW === undefined ? W * 0.88 : o2.maxW;
    const maxH = o2.maxH === undefined ? H * 0.64 : o2.maxH;
    const centerY = o2.centerY === undefined ? H / 2 : o2.centerY;
    const maxSize = o2.maxSize || 420;
    const lines = linesOf(text, maxChars);
    let size = Math.min(maxSize, maxH / (lines.length * 1.2));
    const m = document.createElement('canvas').getContext('2d');
    m.font = font(size);
    let widest = 0;
    for (const line of lines) widest = Math.max(widest, m.measureText(line).width);
    if (widest > maxW) {
      size *= maxW / widest;
      m.font = font(size);
    }
    const lineH = size * 1.2;
    const top = centerY - (lineH * lines.length) / 2;

    const off = document.createElement('canvas');
    off.width = W;
    off.height = H;
    const o = off.getContext('2d');
    o.font = font(size);
    o.fillStyle = '#fff';
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    lines.forEach((line, i) => o.fillText(line, W / 2, top + lineH * (i + 0.5)));

    let order = 0;
    const meta = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      o.font = font(size);
      const width = o.measureText(line).width;
      let x = W / 2 - width / 2;
      const ranges = [];
      for (const ch of line) {
        const w = o.measureText(ch).width;
        ranges.push({ x0: x, x1: x + w, order });
        if (ch !== ' ') order++;
        x += w;
      }
      meta.push({ y0: top + lineH * i, y1: top + lineH * (i + 1), ranges });
    }

    const data = o.getImageData(0, 0, W, H).data;
    let step = W < 720 ? 5 : 6;
    let points = [];
    const scan = (s) => {
      const out = [];
      for (let y = 0; y < H; y += s) {
        const lineMeta = meta.find((q) => y >= q.y0 && y < q.y1);
        if (!lineMeta) continue;
        for (let x = 0; x < W; x += s) {
          if (data[(y * W + x) * 4 + 3] <= 115) continue;
          let r = null;
          for (const q of lineMeta.ranges) {
            if (x >= q.x0 && x < q.x1) { r = q; break; }
          }
          if (!r) {
            let best = Infinity;
            for (const q of lineMeta.ranges) {
              const d = x < q.x0 ? q.x0 - x : x > q.x1 ? x - q.x1 : 0;
              if (d < best) { best = d; r = q; }
            }
          }
          out.push({ x, y, order: r.order });
        }
      }
      return out;
    };
    points = scan(step);
    while (points.length > MAX_PARTICLES) {
      step *= 1.16;
      points = scan(step);
    }
    return { points, lastOrder: Math.max(0, order - 1) };
  }

  function makeParticle(pt, step = STEP_MS, spread = 150, instant = false) {
    const ang = Math.random() * Math.PI * 2;
    const r = instant ? 0 : 24 + Math.random() * spread;
    return {
      x: pt.x + Math.cos(ang) * r,
      y: pt.y + Math.sin(ang) * r,
      tx: pt.x, ty: pt.y, vx: 0, vy: 0,
      order: pt.order,
      ch: RAMP[(Math.random() * RAMP.length) | 0],
      c: colorAt(pt.x / W),
      a: 0.85 + Math.random() * 0.15,
      phase: Math.random() * Math.PI * 2,
      glyphAt: 0,
      reveal: (reduce || instant) ? -Infinity : typingStart + pt.order * step + Math.random() * 220,
    };
  }

  function build() {
    const { points, lastOrder } = sampleText(TEXT);
    typingStart = reduce ? -Infinity : performance.now() + 1200;
    typingEnd = reduce ? Infinity : typingStart + (lastOrder + 1) * STEP_MS;
    disappearStart = reduce ? Infinity : typingEnd + HOLD_MS;
    holdUntil = reduce ? Infinity : disappearStart + (lastOrder + 1) * OUT_MS;
    particles = points.map((pt) => makeParticle(pt));

    const groups = new Map();
    for (const pt of points) {
      const g = groups.get(pt.order) || { x: 0, y: 0, n: 0 };
      g.x += pt.x; g.y += pt.y; g.n++;
      groups.set(pt.order, g);
    }
    letters = [...groups].sort((a, b) => a[0] - b[0]).map(([order, g]) => ({
      t: typingStart + order * STEP_MS,
      x: g.x / g.n,
      y: g.y / g.n,
    }));

    sparks = [];
    sparkCursor = 0;
    burstDone = reduce;
    nextAmbient = typingStart;
    flutter = [];
  }

  // ---- 3D ring geometry ------------------------------------------------
  const RING = {
    R: 0.55,
    TUBE: 0.08,
    GIRDLE_Y: 0.92,
    GIRDLE_R: 0.4,
    TABLE_Y: 1.12,
    TABLE_R: 0.2,
    CULET_Y: 0.66,
    SECTORS: 8,
  };
  const RING_TOP = RING.TABLE_Y;
  const RING_BOTTOM = -RING.R - RING.TUBE;
  const RING_MID = (RING_TOP + RING_BOTTOM) / 2;
  const RING_H = RING_TOP - RING_BOTTOM;
  const RING_BUCKETS = 30;
  const ringBuckets = Array.from({ length: RING_BUCKETS }, () => []);

  function ringCamera() {
    const s = Math.min(
      (H * (W < 720 ? 0.58 : 0.62)) / RING_H,
      (W * 0.9) / (2 * (RING.R + RING.TUBE))
    );
    const half = (RING_H / 2) * s;
    const cy = Math.min(H * 0.44, H * 0.72 - half);
    return { s, cy };
  }

  function ringPoints() {
    const pts = [];
    const theta = Math.max(100, Math.min(150, Math.round(2 * Math.PI * RING.R * ringS / 8)));
    const phi = Math.max(10, Math.min(18, Math.round(2 * Math.PI * RING.TUBE * ringS / 7)));

    for (let i = 0; i < theta; i++) {
      const a = (i / theta) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const tube = RING.TUBE * (1 - 0.3 * Math.max(0, sa) ** 6);
      const d = Math.abs(Math.atan2(Math.sin(a + Math.PI / 2), Math.cos(a + Math.PI / 2))) / Math.PI;
      for (let j = 0; j < phi; j++) {
        const b = (j / phi) * Math.PI * 2;
        const cb = Math.cos(b), sb = Math.sin(b);
        const r = RING.R + tube * cb;
        pts.push({
          x: r * ca, y: r * sa, z: tube * sb * 1.35,
          nx: ca * cb, ny: sa * cb, nz: sb,
          kind: 0, facet: -1,
          delay: d * 1700 + Math.random() * 70,
          ch: Math.random() < 0.34 ? RAMP[(Math.random() * RAMP.length) | 0] : DUST_RAMP[(Math.random() * DUST_RAMP.length) | 0],
          a: 0.9,
          spark: Math.random() < 0.045,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    const addTri = (A, B, C, facet, N) => {
      let nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
      let ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
      let nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      const gx = (A[0] + B[0] + C[0]) / 3;
      const gy = (A[1] + B[1] + C[1]) / 3 - (RING.GIRDLE_Y + RING.TABLE_Y) / 2;
      const gz = (A[2] + B[2] + C[2]) / 3;
      if (nx * gx + ny * gy + nz * gz < 0) { nx = -nx; ny = -ny; nz = -nz; }
      for (let i = 0; i <= N; i++) {
        for (let j = 0; j <= N - i; j++) {
          const u = i / N, v = j / N;
          const x = A[0] + (B[0] - A[0]) * u + (C[0] - A[0]) * v;
          const y = A[1] + (B[1] - A[1]) * u + (C[1] - A[1]) * v;
          const z = A[2] + (B[2] - A[2]) * u + (C[2] - A[2]) * v;
          pts.push({
            x, y, z, nx, ny, nz, kind: 1, facet,
            delay: 1950 + ((y - RING.CULET_Y) / (RING.TABLE_Y - RING.CULET_Y)) * 560 + Math.random() * 70,
            ch: Math.random() < 0.55 ? RAMP[(Math.random() * RAMP.length) | 0] : DUST_RAMP[(Math.random() * DUST_RAMP.length) | 0],
            a: 1, edge: i === 0 || j === 0 || i + j === N,
            phase: Math.random() * Math.PI * 2,
          });
        }
      }
    };

    const M = RING.SECTORS;
    for (let i = 0; i < M; i++) {
      const a0 = (i / M) * Math.PI * 2;
      const a1 = ((i + 1) / M) * Math.PI * 2;
      const g0 = [RING.GIRDLE_R * Math.cos(a0), RING.GIRDLE_Y, RING.GIRDLE_R * Math.sin(a0)];
      const g1 = [RING.GIRDLE_R * Math.cos(a1), RING.GIRDLE_Y, RING.GIRDLE_R * Math.sin(a1)];
      const t0 = [RING.TABLE_R * Math.cos(a0), RING.TABLE_Y, RING.TABLE_R * Math.sin(a0)];
      const t1 = [RING.TABLE_R * Math.cos(a1), RING.TABLE_Y, RING.TABLE_R * Math.sin(a1)];
      const culet = [0, RING.CULET_Y, 0];
      addTri(g0, g1, t0, i * 2, 4);
      addTri(g1, t1, t0, i * 2 + 1, 4);
      addTri(g0, g1, culet, M * 2 + i, 6);
    }

    for (let k = 0; k < 2; k++) {
      for (let i = 0; i < M; i++) {
        const a = (i / M) * Math.PI * 2;
        const r = RING.TABLE_R * (0.45 + 0.55 * k);
        pts.push({
          x: r * Math.cos(a), y: RING.TABLE_Y, z: r * Math.sin(a),
          nx: 0, ny: 1, nz: 0, kind: 1, facet: M * 3,
          delay: 2500 + Math.random() * 60,
          ch: RAMP[1 + ((Math.random() * 3) | 0)], a: 1, edge: k === 1,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    pts.push({
      x: 0, y: RING.TABLE_Y, z: 0, nx: 0, ny: 1, nz: 0, kind: 1, facet: M * 3,
      delay: 2520, ch: '+', a: 1, phase: Math.random() * Math.PI * 2,
    });

    for (let i = 0; i < 4; i++) {
      const a = Math.PI / 4 + i * (Math.PI / 2);
      const ca = Math.cos(a), sa = Math.sin(a);
      const bx = 0.12 * ca, bz = 0.12 * sa, by = RING.R + 0.02;
      const tx = (RING.GIRDLE_R + 0.01) * ca, tz = (RING.GIRDLE_R + 0.01) * sa, ty = RING.GIRDLE_Y - 0.03;
      for (let k = 0; k < 12; k++) {
        const u = k / 11;
        pts.push({
          x: bx + (tx - bx) * u, y: by + (ty - by) * u, z: bz + (tz - bz) * u,
          nx: ca, ny: 0.2, nz: sa, kind: 2, facet: -1,
          delay: 1720 + k * 9,
          ch: k % 3 === 0 ? '|' : '+', a: 1,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    return pts;
  }

  function makeRingParticle(pt, base, instant) {
    const ang = Math.random() * Math.PI * 2;
    const r = instant ? 0 : 0.35 + Math.random() * 0.55;
    return {
      x: pt.x + Math.cos(ang) * r,
      y: pt.y + Math.sin(ang) * r * 1.2,
      z: pt.z + (Math.random() - 0.5) * r * 2,
      tx: pt.x, ty: pt.y, tz: pt.z,
      vx: 0, vy: 0, vz: 0,
      nx: pt.nx, ny: pt.ny, nz: pt.nz,
      kind: pt.kind, facet: pt.facet,
      ch: pt.ch, a: pt.a, spark: pt.spark, edge: pt.edge,
      phase: pt.phase,
      glyphAt: 0,
      reveal: instant ? -Infinity : base + pt.delay + Math.random() * 100,
    };
  }

  function buildRing(instant) {
    phase = 'ring';
    const now = performance.now();
    const cam = ringCamera();
    ringS = cam.s;
    ringCy = cam.cy;
    ringMidY = RING_MID;
    ringOuter = (RING.R + RING.TUBE) * ringS;
    ringParts = ringPoints().map((pt) => makeRingParticle(pt, now, instant));
    gem = {
      x: W / 2,
      y: ringCy - (RING.GIRDLE_Y - ringMidY) * ringS,
      r: RING.GIRDLE_R * ringS * 1.2,
    };
    orbitSparks = [];
    for (let i = 0; i < 96; i++) {
      orbitSparks.push({
        x: (Math.random() * 2 - 1) * 1.05,
        y: -0.55 + Math.random() * 1.85,
        z: (Math.random() * 2 - 1) * 0.6,
        phase: Math.random() * Math.PI * 2,
        speed: 0.45 + Math.random() * 1.4,
        ch: Math.random() < 0.25 ? '✦' : Math.random() < 0.5 ? '*' : '+',
        c: Math.random() < 0.5 ? '#fff1d0' : Math.random() < 0.7 ? '#ff8fc7' : '#7ef0c0',
      });
    }
    particles = [];
    letters = [];
    sparkCursor = 0;
    burstDone = true;
    holdUntil = instant ? Infinity : now + 5600;
    gemBurstAt = instant ? -Infinity : now + 2750;
    gemBurstDone = !!instant;
    nextGemSpark = -Infinity;
    nextGemHeart = -Infinity;
    nextRingSpark = now + 1200;
    flashAt = -Infinity;
  }

  function buildAsk(instant) {
    phase = 'ask';
    const now = performance.now();
    const { points, lastOrder } = sampleText(ASK, {
      maxChars: W < 720 ? 14 : 26,
      maxW: W * 0.9,
      maxH: H * 0.2,
      centerY: H * 0.82,
      maxSize: 100,
    });
    typingStart = instant ? -Infinity : now + 250;
    typingEnd = instant ? -Infinity : typingStart + (lastOrder + 1) * ASK_MS;
    disappearStart = Infinity;
    holdUntil = Infinity;
    particles = points.map((pt) => makeParticle(pt, ASK_MS, 110, instant));

    const groups = new Map();
    for (const pt of points) {
      const g = groups.get(pt.order) || { x: 0, y: 0, n: 0 };
      g.x += pt.x; g.y += pt.y; g.n++;
      groups.set(pt.order, g);
    }
    letters = [...groups].sort((a, b) => a[0] - b[0]).map(([order, g]) => ({
      t: typingStart + order * ASK_MS,
      x: g.x / g.n,
      y: g.y / g.n,
    }));

    sparkCursor = 0;
    burstDone = !!instant || reduce;
    nextAmbient = typingStart;
    flutter = [];
  }

  function seedStars() {
    stars = [];
    const n = Math.min(150, Math.round((W * H) / 22000));
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        ch: SPARK_RAMP[(Math.random() * SPARK_RAMP.length) | 0],
        c: Math.random() < 0.55 ? '#fff1d0' : colorAt(Math.random()),
        a: 0.10 + Math.random() * 0.26,
        speed: 0.6 + Math.random() * 1.7,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function seedHearts() {
    hearts = [];
    const n = Math.max(6, Math.round((W * H) / 110000));
    for (let i = 0; i < n; i++) {
      hearts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vy: -(8 + Math.random() * 16),
        amp: 8 + Math.random() * 22,
        freq: 0.25 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        ch: Math.random() < 0.5 ? '♥' : '♡',
        c: Math.random() < 0.6 ? '#ff8fc7' : Math.random() < 0.5 ? '#fff1d0' : '#7ef0c0',
        a: 0.10 + Math.random() * 0.16,
        size: 10 + Math.random() * 8,
      });
    }
  }

  function seedPetals() {
    petals = [];
    const n = Math.max(6, Math.round((W * H) / 150000));
    for (let i = 0; i < n; i++) {
      petals.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vy: 7 + Math.random() * 13,
        amp: 10 + Math.random() * 26,
        freq: 0.2 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
        ch: PETAL_RAMP[(Math.random() * PETAL_RAMP.length) | 0],
        c: Math.random() < 0.7 ? '#ff8fc7' : '#fff1d0',
        a: 0.07 + Math.random() * 0.13,
        size: 9 + Math.random() * 7,
      });
    }
  }

  function addHearts(x, y, now, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 35 + Math.random() * 95;
      flutter.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 18,
        born: now,
        life: 1500 + Math.random() * 1000,
        ch: Math.random() < 0.5 ? '♥' : '♡',
        c: Math.random() < 0.6 ? '#ff8fc7' : '#fff1d0',
        size: 12 + Math.random() * 10,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  let heartCloud = null;
  function getHeartCloud() {
    if (heartCloud) return heartCloud;
    heartCloud = [];
    const push = (hx, hy, ch, c, a, size) => heartCloud.push({
      x: hx / 17, y: hy / 17, ch, c, a, size, phase: Math.random() * Math.PI * 2,
    });
    for (let i = 0; i < 120; i++) {
      const t = (i / 120) * Math.PI * 2;
      const hx = 16 * Math.sin(t) ** 3;
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      push(hx, hy, i % 4 === 0 ? '♥' : i % 3 === 0 ? '*' : '+', Math.random() < 0.62 ? '#ff8fc7' : '#fff1d0', 0.95, 11);
    }
    for (let i = 0; i < 220; i++) {
      const t = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * 0.85;
      const hx = 16 * Math.sin(t) ** 3 * rr;
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * rr;
      push(hx, hy, Math.random() < 0.18 ? '♥' : '·', Math.random() < 0.6 ? '#ff8fc7' : '#7ef0c0', 0.5, 9);
    }
    return heartCloud;
  }

  function addBigHeart(x, y, now, size, alpha) {
    if (bigHearts.length > 3) bigHearts.shift();
    bigHearts.push({
      x, y, born: now, life: 2800 + Math.random() * 700,
      size, alpha, pts: getHeartCloud(),
      tilt: (Math.random() - 0.5) * 0.2,
    });
  }

  function addSparks(x, y, now, count, speed, life) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.35 + Math.random() * 0.65);
      sparks.push({
        x: x + (Math.random() - 0.5) * 10,
        y: y + (Math.random() - 0.5) * 10,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 24,
        born: now,
        life: life * (0.6 + Math.random() * 0.8),
        g: 0.9,
        ch: SPARK_RAMP[(Math.random() * 2) | 0],
        c: Math.random() < 0.6 ? '#fff1d0' : colorAt(Math.random()),
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function burst(now, bx = W / 2, by = H / 2) {
    const n = 150;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.05;
      const v = 130 + Math.random() * 260;
      sparks.push({
        x: bx,
        y: by,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        born: now,
        life: 900 + Math.random() * 900,
        g: 0.08,
        ch: SPARK_RAMP[(Math.random() * SPARK_RAMP.length) | 0],
        c: Math.random() < 0.5 ? '#fff1d0' : colorAt(Math.random()),
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function seedDust() {
    dust = [];
    const n = Math.round((W * H) / 16000);
    for (let i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.12,
        vy: -0.04 - Math.random() * 0.12,
        ch: DUST_RAMP[(Math.random() * DUST_RAMP.length) | 0],
        c: colorAt(Math.random()),
        a: 0.06 + Math.random() * 0.16,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function drawRing(now) {
    if (!ringParts.length) return;
    const yaw = reduce ? 0 : (now * 0.00046) % (Math.PI * 2);
    const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
    const vx = 0, vy = 0.3134, vz = 0.9497;
    const kx = 0.2018, ky = 0.8071, kz = 0.5549;
    const hx = 0.107, hy = 0.5938, hz = 0.7974;

    for (const b of ringBuckets) b.length = 0;

    for (const p of ringParts) {
      if (now < p.reveal) continue;
      p.vx += (p.tx - p.x) * 0.06;
      p.vy += (p.ty - p.y) * 0.06;
      p.vz += (p.tz - p.z) * 0.06;
      p.vx *= 0.87; p.vy *= 0.87; p.vz *= 0.87;
      p.x += p.vx; p.y += p.vy; p.z += p.vz;

      const rx = p.x * cyaw + p.z * syaw;
      const rz = -p.x * syaw + p.z * cyaw;
      const ry = p.y;
      const persp = 5 / (5 - rz);
      p.sx = W / 2 + rx * ringS * persp;
      p.sy = ringCy - (ry - ringMidY) * ringS * persp;

      const nx = p.nx * cyaw + p.nz * syaw;
      const nz = -p.nx * syaw + p.nz * cyaw;
      const ny = p.ny;
      const facing = nx * vx + ny * vy + nz * vz;
      if (p.kind !== 2 && facing < 0.01) continue;

      const diff = Math.max(0, nx * kx + ny * ky + nz * kz);
      const spec = Math.max(0, nx * hx + ny * hy + nz * hz) ** 26;
      const shade = p.kind === 1
        ? 0.7 + 0.3 * diff + 1.2 * spec
        : 0.4 + 0.5 * diff + 0.75 * spec;

      let col, ch = p.ch, alpha;
      if (p.kind === 1) {
        if (p.edge) {
          col = '#fff1d0'; ch = '+'; alpha = 0.8;
        } else {
          const fire = (p.facet + ((now * 0.0025) | 0)) % 5;
          col = spec > 0.3 ? (fire === 0 ? '#ff8fc7' : fire === 1 ? '#7ef0c0' : '#fff1d0') : '#fff1d0';
          alpha = 0.55 + 0.45 * Math.min(1, shade);
          if (spec > 0.55) { ch = '*'; alpha = 1; }
          else if (spec > 0.2) { ch = '+'; alpha = Math.min(1, alpha + 0.15); }
        }
      } else if (p.kind === 2) {
        col = '#fff1d0';
        alpha = 0.9;
      } else {
        col = colorAt(p.sx / W);
        alpha = 0.3 + 0.7 * Math.min(1, shade);
      }

      if (p.spark) {
        const tw = Math.max(0, Math.sin(now * 0.0035 + p.phase)) ** 6;
        if (tw > 0.28) {
          ch = tw > 0.6 ? '*' : '+';
          col = tw > 0.6 ? '#fff1d0' : '#ff8fc7';
          alpha = Math.min(1, alpha + tw * 0.6);
        }
      }
      if (reduce) alpha = Math.max(alpha, 0.8);
      else alpha *= 0.82 + 0.18 * Math.sin(now * 0.002 + p.phase * 3);

      p.sa = alpha;
      p.sc = col;
      p.sch = ch;
      if (p.kind === 2) continue;
      const bi = Math.max(0, Math.min(RING_BUCKETS - 1, (((rz + 0.9) / 1.8) * RING_BUCKETS) | 0));
      ringBuckets[bi].push(p);
    }

    for (const bucket of ringBuckets) {
      for (const p of bucket) {
        ctx.globalAlpha = p.sa;
        ctx.fillStyle = p.sc;
        ctx.fillText(
          p.sch,
          p.sx + Math.sin(now * 0.0012 + p.phase) * 0.7,
          p.sy + Math.cos(now * 0.0009 + p.phase * 1.4) * 0.7
        );
      }
    }

    ctx.font = `13px ${FONT}`;
    for (const p of ringParts) {
      if (p.kind !== 2 || p.sa === undefined || now < p.reveal) continue;
      ctx.globalAlpha = p.sa;
      ctx.fillStyle = p.sc;
      ctx.fillText(p.sch, p.sx, p.sy);
    }
    ctx.font = `10px ${FONT}`;
    ctx.globalAlpha = 1;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seedDust();
    seedStars();
    seedHearts();
    seedPetals();
    if (phase === 'message') build();
    else if (phase === 'ring') buildRing(false);
    else { buildRing(true); buildAsk(true); }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (now >= holdUntil) {
      if (phase === 'message') buildRing(false);
      else if (phase === 'ring') buildAsk(false);
    }
    const dt = Math.min(0.05, Math.max(0, (now - prevNow) / 1000)) || 0.016;
    prevNow = now;

    ctx.clearRect(0, 0, W, H);
    ctx.font = `10px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (!reduce && phase !== 'ring' && now > typingEnd) {
      const beat = Math.max(0, Math.sin((now - typingEnd) * 0.0055)) ** 8;
      if (beat > 0.01) {
        const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * 0.75);
        g.addColorStop(0, `rgba(255,143,199,${(0.07 * beat).toFixed(3)})`);
        g.addColorStop(1, 'rgba(255,143,199,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
    }

    if (phase === 'message' && pointerIn && pressing) {
      holeR = Math.min(64, 16 + (now - pressAt) * 0.016);
    } else {
      holeR = Math.max(16, holeR - dt * 90);
    }

    const flash = Math.max(0, 1 - (now - flashAt) / 800);
    if (flash > 0) {
      const fg = ctx.createRadialGradient(gem.x, gem.y, 0, gem.x, gem.y, Math.max(W, H) * 0.45);
      fg.addColorStop(0, `rgba(255,241,208,${(0.32 * flash).toFixed(3)})`);
      fg.addColorStop(0.45, `rgba(255,143,199,${(0.1 * flash).toFixed(3)})`);
      fg.addColorStop(1, 'rgba(255,143,199,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, W, H);
    }

    if (!reduce && now >= nextBigHeart) {
      if (phase === 'message') {
        addBigHeart(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.6), now, 120 + Math.random() * 100, 0.2);
        nextBigHeart = now + 6500 + Math.random() * 5500;
      } else {
        const side = Math.random() < 0.5 ? -1 : 1;
        addBigHeart(W / 2 + side * (ringOuter * 0.95 + W * 0.04), ringCy - ringS * 0.18 + Math.random() * ringS * 0.6, now, 170 + Math.random() * 120, 0.55);
        nextBigHeart = now + 2200 + Math.random() * 2200;
      }
    }
    if (!reduce && phase !== 'message' && now >= nextHeroHeart) {
      addBigHeart(W / 2, ringCy + ringS * 0.015, now, (RING.R - RING.TUBE) * ringS * 0.94, 0.75);
      nextHeroHeart = now + 4800 + Math.random() * 1800;
    }

    for (const h of hearts) {
      if (!reduce) {
        h.y += h.vy * dt;
        if (h.y < -24) { h.y = H + 24; h.x = Math.random() * W; }
      }
      const x = h.x + Math.sin(now * 0.001 * h.freq + h.phase) * h.amp;
      ctx.globalAlpha = h.a * (reduce ? 1 : 0.65 + 0.35 * Math.sin(now * 0.0013 + h.phase));
      ctx.fillStyle = h.c;
      ctx.font = `${h.size}px ${FONT}`;
      ctx.fillText(h.ch, x, h.y);
    }

    for (const p of petals) {
      if (!reduce) {
        p.y += p.vy * dt;
        if (p.y > H + 24) { p.y = -24; p.x = Math.random() * W; }
      }
      const x = p.x + Math.sin(now * 0.001 * p.freq + p.phase) * p.amp;
      ctx.globalAlpha = p.a * (reduce ? 1 : 0.6 + 0.4 * Math.sin(now * 0.0009 + p.phase));
      ctx.fillStyle = p.c;
      ctx.font = `${p.size}px ${FONT}`;
      ctx.fillText(p.ch, x, p.y);
    }
    ctx.font = `10px ${FONT}`;

    for (const s of stars) {
      const tw = reduce ? 0.45 : Math.max(0, Math.sin(now * 0.001 * s.speed + s.phase)) ** 6;
      ctx.globalAlpha = s.a * (0.22 + 0.78 * tw);
      ctx.fillStyle = s.c;
      ctx.fillText(s.ch, s.x, s.y);
    }

    if (!reduce) {
      if (!meteor && now >= nextMeteor) {
        const dir = Math.random() < 0.5 ? 1 : -1;
        meteor = {
          x: dir > 0 ? -40 : W + 40,
          y: H * (0.08 + Math.random() * 0.26),
          vx: dir * (420 + Math.random() * 260),
          vy: 90 + Math.random() * 70,
          born: now,
          life: 900 + Math.random() * 500,
        };
      }
      if (meteor) {
        const age = (now - meteor.born) / meteor.life;
        if (age >= 1) {
          meteor = null;
          nextMeteor = now + 8000 + Math.random() * 9000;
        } else {
          const t = (now - meteor.born) / 1000;
          for (let i = 0; i < 9; i++) {
            const q = t - i * 0.02;
            if (q < 0) break;
            const x = meteor.x + meteor.vx * q;
            const y = meteor.y + meteor.vy * q;
            ctx.globalAlpha = (1 - i / 9) * 0.7 * (1 - age);
            ctx.fillStyle = i === 0 ? '#fff1d0' : '#ff8fc7';
            ctx.fillText(i === 0 ? '*' : '·', x, y);
          }
        }
      }
    }

    for (const d of dust) {
      if (!reduce) {
        d.x += d.vx;
        d.y += d.vy;
        if (d.y < -12) { d.y = H + 12; d.x = Math.random() * W; }
        if (d.x < -12) d.x = W + 12;
        else if (d.x > W + 12) d.x = -12;
      }
      ctx.globalAlpha = d.a * (reduce ? 1 : 0.65 + 0.35 * Math.sin(now * 0.0011 + d.phase));
      ctx.fillStyle = d.c;
      ctx.fillText(d.ch, d.x, d.y);
    }

    for (let i = bigHearts.length - 1; i >= 0; i--) {
      const h = bigHearts[i];
      const t = (now - h.born) / h.life;
      if (t >= 1) { bigHearts.splice(i, 1); continue; }
      const grow = Math.sin(Math.PI * t);
      const s = h.size * (0.05 + 0.95 * grow);
      const a = h.alpha * (0.15 + 0.85 * grow);
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.tilt);
      for (const q of h.pts) {
        ctx.globalAlpha = a * q.a * (0.7 + 0.3 * Math.sin(now * 0.006 + q.phase));
        ctx.fillStyle = q.c;
        ctx.font = `${q.size}px ${FONT}`;
        ctx.fillText(q.ch, q.x * s, q.y * s);
      }
      ctx.restore();
    }
    ctx.font = `10px ${FONT}`;

    if (phase !== 'message' && now > gemBurstAt - 900) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.0025);
      const gr = Math.max(70, gem.r * 2.6);
      const gg = ctx.createRadialGradient(gem.x, gem.y, 0, gem.x, gem.y, gr);
      gg.addColorStop(0, `rgba(255,241,208,${(0.08 + 0.06 * pulse).toFixed(3)})`);
      gg.addColorStop(0.45, `rgba(255,143,199,${(0.04 + 0.03 * pulse).toFixed(3)})`);
      gg.addColorStop(1, 'rgba(255,143,199,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = gg;
      ctx.fillRect(gem.x - gr, gem.y - gr, gr * 2, gr * 2);
    }

    drawRing(now);

    if (!reduce && phase !== 'message') {
      const yaw = (now * 0.00046) % (Math.PI * 2);
      const cy2 = Math.cos(yaw), sy2 = Math.sin(yaw);
      ctx.font = `13px ${FONT}`;
      for (const o of orbitSparks) {
        const rx = o.x * cy2 + o.z * sy2;
        const rz = -o.x * sy2 + o.z * cy2;
        const persp = 5 / (5 - rz);
        const sx = W / 2 + rx * ringS * persp;
        const sy = ringCy - (o.y - ringMidY) * ringS * persp;
        if (sx < 8 || sx > W - 8 || sy < 8 || sy > H - 8) continue;
        const tw = Math.sin(now * 0.002 * o.speed + o.phase);
        if (tw < 0.35) continue;
        const k = (tw - 0.35) / 0.65;
        ctx.globalAlpha = k * 0.95;
        ctx.fillStyle = o.c;
        ctx.fillText(k > 0.72 ? '*' : o.ch, sx, sy);
      }
    }
    ctx.font = `10px ${FONT}`;

    for (const p of particles) {
      if (now < p.reveal) continue;

      const out = now - (disappearStart + p.order * OUT_MS);
      const pfade = out <= 0 ? 1 : Math.max(0, 1 - out / OUT_MS);
      if (pfade <= 0) continue;

      if (!reduce && now > p.glyphAt) {
        p.ch = RAMP[(Math.random() * RAMP.length) | 0];
        p.glyphAt = now + 2500 + Math.random() * 5000;
      }

      if (reduce) {
        p.x = p.tx;
        p.y = p.ty;
      } else {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        const REACH = holeR * 7.5;
        const infl = phase === 'message' && d2 < REACH * REACH ? 1 - Math.sqrt(d2) / REACH : 0;

        const k = 0.06 * (1 - 0.85 * infl);
        p.vx += (p.tx - p.x) * k;
        p.vy += (p.ty - p.y) * k;

        if (infl > 0) {
          const d = Math.sqrt(d2) || 1;
          const pull = 7 * infl * infl;
          p.vx -= (dx / d) * pull;
          p.vy -= (dy / d) * pull;
          p.vx += (-dy / d) * pull * 0.75;
          p.vy += (dx / d) * pull * 0.75;
        }

        p.vx *= 0.86; p.vy *= 0.86;
        p.vx = Math.max(-18, Math.min(18, p.vx));
        p.vy = Math.max(-18, Math.min(18, p.vy));
        p.x += p.vx; p.y += p.vy;
      }

      const wobble = reduce ? 0 : 1.5;
      const x = p.x + Math.sin(now * 0.0011 + p.phase) * wobble;
      const y = p.y + Math.cos(now * 0.0009 + p.phase * 1.4) * wobble;
      const twinkle = reduce ? 1 : 0.8 + 0.2 * Math.sin(now * 0.0022 + p.phase * 3);
      ctx.globalAlpha = p.a * twinkle * pfade;
      ctx.fillStyle = p.c;
      ctx.fillText(p.ch, x, y);
    }

    if (!reduce) {
      if (phase !== 'message') {
        if (!gemBurstDone && now >= gemBurstAt) {
          addSparks(gem.x, gem.y, now, 140, 190, 1200);
          addHearts(gem.x, gem.y, now, 16);
          addBigHeart(gem.x, gem.y, now, 160, 0.55);
          flashAt = now;
          gemBurstDone = true;
        }
        if (now >= gemBurstAt && now >= nextGemSpark) {
          addSparks(gem.x, gem.y, now, 2, 80, 900);
          nextGemSpark = now + 240 + Math.random() * 700;
        }
        if (now >= nextRingSpark && ringParts.length) {
          const p = ringParts[(Math.random() * ringParts.length) | 0];
          if (p.sx !== undefined) addSparks(p.sx, p.sy, now, 1, 48, 650);
          nextRingSpark = now + 55 + Math.random() * 95;
        }
        if (phase === 'ask' && now >= nextGemHeart) {
          addHearts(gem.x, gem.y, now, 1);
          nextGemHeart = now + 1200 + Math.random() * 1800;
        }
      }
      while (sparkCursor < letters.length && now >= letters[sparkCursor].t) {
        const L = letters[sparkCursor++];
        addSparks(L.x, L.y, now, 10, 170, 1000);
      }
      if (now >= nextAmbient && sparkCursor > 0) {
        const L = letters[(Math.random() * sparkCursor) | 0];
        addSparks(L.x, L.y, now, 2, 110, 800);
        nextAmbient = now + 260 + Math.random() * 320;
      }
      if (!burstDone && now >= typingEnd + 280) {
        const by = phase === 'ask' ? H * 0.76 : H / 2;
        burst(now, W / 2, by);
        addBigHeart(W / 2, by, now, 170, 0.5);
        flashAt = now;
        for (let i = 0; i < 18; i++) {
          const L = letters[(Math.random() * letters.length) | 0];
          addHearts(L.x, L.y, now, 1);
        }
        burstDone = true;
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      const age = (now - s.born) / s.life;
      if (age >= 1) { sparks.splice(i, 1); continue; }
      s.vy += 240 * dt * s.g;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      const a = Math.pow(1 - age, 1.4) * (0.6 + 0.4 * Math.sin(now * 0.03 + s.phase));
      ctx.globalAlpha = a;
      ctx.fillStyle = s.c;
      ctx.fillText(s.ch, s.x, s.y);
    }

    for (let i = flutter.length - 1; i >= 0; i--) {
      const h = flutter[i];
      const age = (now - h.born) / h.life;
      if (age >= 1) { flutter.splice(i, 1); continue; }
      h.vy += 22 * dt;
      h.vx *= 0.995;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      ctx.globalAlpha = (1 - age) * (0.55 + 0.45 * Math.sin(now * 0.004 + h.phase));
      ctx.fillStyle = h.c;
      ctx.font = `${h.size}px ${FONT}`;
      ctx.fillText(h.ch, h.x, h.y);
    }
    ctx.font = `10px ${FONT}`;

    if (!reduce && pointerIn && phase === 'message') {
      const r = holeR;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, r * 0.9, mouse.x, mouse.y, r * 3);
      g.addColorStop(0, 'rgba(126,240,192,0.30)');
      g.addColorStop(0.38, 'rgba(255,143,199,0.12)');
      g.addColorStop(1, 'rgba(255,143,199,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,241,208,0.7)';
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r + 0.75, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 180);
  });

  canvas.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    pointerIn = true;
  });
  canvas.addEventListener('pointerleave', () => {
    mouse.x = -1e4;
    mouse.y = -1e4;
    pointerIn = false;
  });
  window.addEventListener('pointerup', (e) => {
    pressing = false;
    if (e.pointerType && e.pointerType !== 'mouse') pointerIn = false;
  });
  window.addEventListener('pointercancel', () => { pressing = false; });
  window.addEventListener('blur', () => { pressing = false; });
  canvas.addEventListener('pointerdown', (e) => {
    pointerIn = true;
    pressing = true;
    pressAt = performance.now();
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
