<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you~ — text animation</title>
<meta name="description" content="A message that writes itself, one letter at a time, assembled from a field of ASCII glyphs. An original animation by @nummbee01.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080a'/%3E%3Ctext x='4' y='23' font-family='monospace' font-size='20' fill='%237ef0c0'%3E@%3C/text%3E%3C/svg%3E">
<style>
  :root{ --bg:#07080a; --ink:#e8edf2; --mute:#8a94a3; --mint:#7ef0c0; --pink:#ff8fc7; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(60rem 40rem at 18% -12%, rgba(126,240,192,.12), transparent 62%),
      radial-gradient(52rem 36rem at 92% 112%, rgba(255,143,199,.12), transparent 62%),
      radial-gradient(46rem 24rem at 50% 52%, rgba(126,240,192,.055), transparent 70%);
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  #c{position:fixed; inset:0; width:100%; height:100%; display:block}
  .hud{position:fixed; top:22px; left:24px; z-index:2; pointer-events:none}
  .hud b{display:block; font-size:12px; letter-spacing:.16em; color:var(--pink); font-weight:600}
  .hud span{font-size:12px; color:var(--mute)}
  .hud a{color:var(--mint); text-decoration:none; pointer-events:auto}
  .hud a:hover{text-decoration:underline}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<p class="sr">A message that writes itself one letter at a time: Я тебя люблю. Я жить без тебя не могу~. Hover to open a black hole, hold to grow it, click or tap to scatter the glyphs.</p>
<div class="hud">
  <b>For you~</b>
  <span>a message by <a href="https://github.com/nummbee01">@nummbee01</a> · hover: black hole · hold: grow · click: scatter</span>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TEXT = 'Я тебя люблю. Я жить без тебя не могу~';
  const STEP_MS = 1000;
  const HOLD_MS = 6000;
  const FADE_MS = 1400;
  const RAMP = '#%@&$BQ08';
  const DUST_RAMP = '.,:;+*';
  const SPARK_RAMP = '*+·';
  const FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const MAX_PARTICLES = 6000;

  let W = 0, H = 0, DPR = 1, particles = [], dust = [], stars = [], sparks = [], hearts = [], flutter = [];
  let typingStart = 0, typingEnd = 0, holdUntil = Infinity, fadeStart = Infinity;
  let letters = [], sparkCursor = 0, burstDone = true, prevNow = 0, nextAmbient = 0;
  const mouse = { x: -1e4, y: -1e4 };
  let pointerIn = false, pressing = false, holeR = 16, pressAt = 0;

  const font = (s) => `900 ${s}px ${SANS}`;
  const STOPS = [[126, 240, 192], [255, 241, 208], [255, 143, 199]];

  function colorAt(t) {
    t = Math.max(0, Math.min(1, t));
    const seg = t * (STOPS.length - 1);
    const i = Math.min(STOPS.length - 2, Math.floor(seg));
    const f = seg - i;
    const a = STOPS[i], b = STOPS[i + 1];
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)}, ${Math.round(a[1] + (b[1] - a[1]) * f)}, ${Math.round(a[2] + (b[2] - a[2]) * f)})`;
  }

  function linesOf(text, maxChars) {
    const sentences = text.replace(/([.!?…])\s+/g, '$1\n').split('\n');
    const lines = [];
    for (const sentence of sentences) {
      const s = sentence.trim();
      if (!s) continue;
      if (s.length <= maxChars) { lines.push(s); continue; }
      let line = '';
      for (const word of s.split(/\s+/)) {
        if (line && (line + ' ' + word).length > maxChars) { lines.push(line); line = word; }
        else line = line ? line + ' ' + word : word;
      }
      if (line) lines.push(line);
    }
    return lines;
  }

  function sampleTargets(text) {
    const lines = linesOf(text, W < 720 ? 18 : 30);
    const maxW = W * 0.88;
    const maxH = H * 0.64;
    let size = Math.min(420, maxH / (lines.length * 1.2));
    const m = document.createElement('canvas').getContext('2d');
    m.font = font(size);
    let widest = 0;
    for (const line of lines) widest = Math.max(widest, m.measureText(line).width);
    if (widest > maxW) {
      size *= maxW / widest;
      m.font = font(size);
    }
    const lineH = size * 1.2;
    const top = H / 2 - (lineH * lines.length) / 2;

    const off = document.createElement('canvas');
    off.width = W;
    off.height = H;
    const o = off.getContext('2d');
    o.font = font(size);
    o.fillStyle = '#fff';
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    lines.forEach((line, i) => o.fillText(line, W / 2, top + lineH * (i + 0.5)));

    let order = 0;
    const meta = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      o.font = font(size);
      const width = o.measureText(line).width;
      let x = W / 2 - width / 2;
      const ranges = [];
      for (const ch of line) {
        const w = o.measureText(ch).width;
        ranges.push({ x0: x, x1: x + w, order });
        if (ch !== ' ') order++;
        x += w;
      }
      meta.push({ y0: top + lineH * i, y1: top + lineH * (i + 1), ranges });
    }

    const data = o.getImageData(0, 0, W, H).data;
    let step = W < 720 ? 5 : 6;
    let points = [];
    const scan = (s) => {
      const out = [];
      for (let y = 0; y < H; y += s) {
        const lineMeta = meta.find((q) => y >= q.y0 && y < q.y1);
        if (!lineMeta) continue;
        for (let x = 0; x < W; x += s) {
          if (data[(y * W + x) * 4 + 3] <= 115) continue;
          let r = null;
          for (const q of lineMeta.ranges) {
            if (x >= q.x0 && x < q.x1) { r = q; break; }
          }
          if (!r) {
            let best = Infinity;
            for (const q of lineMeta.ranges) {
              const d = x < q.x0 ? q.x0 - x : x > q.x1 ? x - q.x1 : 0;
              if (d < best) { best = d; r = q; }
            }
          }
          out.push({ x, y, order: r.order });
        }
      }
      return out;
    };
    points = scan(step);
    while (points.length > MAX_PARTICLES) {
      step *= 1.16;
      points = scan(step);
    }
    return { points, lastOrder: Math.max(0, order - 1) };
  }

  function makeParticle(pt) {
    const ang = Math.random() * Math.PI * 2;
    const r = 30 + Math.random() * 150;
    return {
      x: pt.x + Math.cos(ang) * r,
      y: pt.y + Math.sin(ang) * r,
      tx: pt.x, ty: pt.y, vx: 0, vy: 0,
      ch: RAMP[(Math.random() * RAMP.length) | 0],
      c: colorAt(pt.x / W),
      a: 0.85 + Math.random() * 0.15,
      phase: Math.random() * Math.PI * 2,
      reveal: reduce ? -Infinity : typingStart + pt.order * STEP_MS + Math.random() * 220,
    };
  }

  function build() {
    const { points, lastOrder } = sampleTargets(TEXT);
    typingStart = reduce ? -Infinity : performance.now() + 1200;
    typingEnd = typingStart + (lastOrder + 1) * STEP_MS;
    holdUntil = reduce ? Infinity : typingEnd + HOLD_MS;
    fadeStart = reduce ? Infinity : holdUntil - FADE_MS;
    particles = points.map(makeParticle);

    const groups = new Map();
    for (const pt of points) {
      const g = groups.get(pt.order) || { x: 0, y: 0, n: 0 };
      g.x += pt.x; g.y += pt.y; g.n++;
      groups.set(pt.order, g);
    }
    letters = [...groups].sort((a, b) => a[0] - b[0]).map(([order, g]) => ({
      t: typingStart + order * STEP_MS,
      x: g.x / g.n,
      y: g.y / g.n,
    }));

    sparks = [];
    sparkCursor = 0;
    burstDone = reduce;
    nextAmbient = typingStart;
    flutter = [];
  }

  function seedStars() {
    stars = [];
    const n = Math.min(150, Math.round((W * H) / 22000));
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        ch: SPARK_RAMP[(Math.random() * SPARK_RAMP.length) | 0],
        c: Math.random() < 0.55 ? '#fff1d0' : colorAt(Math.random()),
        a: 0.10 + Math.random() * 0.26,
        speed: 0.6 + Math.random() * 1.7,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function seedHearts() {
    hearts = [];
    const n = Math.max(6, Math.round((W * H) / 110000));
    for (let i = 0; i < n; i++) {
      hearts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vy: -(8 + Math.random() * 16),
        amp: 8 + Math.random() * 22,
        freq: 0.25 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        ch: Math.random() < 0.5 ? '♥' : '♡',
        c: Math.random() < 0.6 ? '#ff8fc7' : Math.random() < 0.5 ? '#fff1d0' : '#7ef0c0',
        a: 0.10 + Math.random() * 0.16,
        size: 10 + Math.random() * 8,
      });
    }
  }

  function addHearts(x, y, now, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 35 + Math.random() * 95;
      flutter.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 18,
        born: now,
        life: 1500 + Math.random() * 1000,
        ch: Math.random() < 0.5 ? '♥' : '♡',
        c: Math.random() < 0.6 ? '#ff8fc7' : '#fff1d0',
        size: 12 + Math.random() * 10,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function addSparks(x, y, now, count, speed, life) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.35 + Math.random() * 0.65);
      sparks.push({
        x: x + (Math.random() - 0.5) * 10,
        y: y + (Math.random() - 0.5) * 10,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 24,
        born: now,
        life: life * (0.6 + Math.random() * 0.8),
        g: 0.9,
        ch: SPARK_RAMP[(Math.random() * 2) | 0],
        c: Math.random() < 0.6 ? '#fff1d0' : colorAt(Math.random()),
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function burst(now) {
    const n = 150;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.05;
      const v = 130 + Math.random() * 260;
      sparks.push({
        x: W / 2,
        y: H / 2,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        born: now,
        life: 900 + Math.random() * 900,
        g: 0.08,
        ch: SPARK_RAMP[(Math.random() * SPARK_RAMP.length) | 0],
        c: Math.random() < 0.5 ? '#fff1d0' : colorAt(Math.random()),
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function seedDust() {
    dust = [];
    const n = Math.round((W * H) / 16000);
    for (let i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.12,
        vy: -0.04 - Math.random() * 0.12,
        ch: DUST_RAMP[(Math.random() * DUST_RAMP.length) | 0],
        c: colorAt(Math.random()),
        a: 0.06 + Math.random() * 0.16,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seedDust();
    seedStars();
    seedHearts();
    build();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (now >= holdUntil) build();
    const dt = Math.min(0.05, Math.max(0, (now - prevNow) / 1000)) || 0.016;
    prevNow = now;
    const fade = now > fadeStart ? Math.max(0, (holdUntil - now) / FADE_MS) : 1;

    ctx.clearRect(0, 0, W, H);
    ctx.font = `10px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (pointerIn && pressing) {
      holeR = Math.min(64, 16 + (now - pressAt) * 0.016);
    } else {
      holeR = Math.max(16, holeR - dt * 90);
    }

    for (const h of hearts) {
      if (!reduce) {
        h.y += h.vy * dt;
        if (h.y < -24) { h.y = H + 24; h.x = Math.random() * W; }
      }
      const x = h.x + Math.sin(now * 0.001 * h.freq + h.phase) * h.amp;
      ctx.globalAlpha = h.a * (reduce ? 1 : 0.65 + 0.35 * Math.sin(now * 0.0013 + h.phase)) * fade;
      ctx.fillStyle = h.c;
      ctx.font = `${h.size}px ${FONT}`;
      ctx.fillText(h.ch, x, h.y);
    }
    ctx.font = `10px ${FONT}`;

    for (const s of stars) {
      const tw = reduce ? 0.45 : Math.max(0, Math.sin(now * 0.001 * s.speed + s.phase)) ** 6;
      ctx.globalAlpha = s.a * (0.22 + 0.78 * tw) * fade;
      ctx.fillStyle = s.c;
      ctx.fillText(s.ch, s.x, s.y);
    }

    for (const d of dust) {
      if (!reduce) {
        d.x += d.vx;
        d.y += d.vy;
        if (d.y < -12) { d.y = H + 12; d.x = Math.random() * W; }
        if (d.x < -12) d.x = W + 12;
        else if (d.x > W + 12) d.x = -12;
      }
      ctx.globalAlpha = d.a * (reduce ? 1 : 0.65 + 0.35 * Math.sin(now * 0.0011 + d.phase));
      ctx.fillStyle = d.c;
      ctx.fillText(d.ch, d.x, d.y);
    }

    for (const p of particles) {
      if (now < p.reveal) continue;

      if (reduce) {
        p.x = p.tx;
        p.y = p.ty;
      } else {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        const REACH = holeR * 7.5;
        const infl = d2 < REACH * REACH ? 1 - Math.sqrt(d2) / REACH : 0;

        const k = 0.06 * (1 - 0.85 * infl);
        p.vx += (p.tx - p.x) * k;
        p.vy += (p.ty - p.y) * k;

        if (infl > 0) {
          const d = Math.sqrt(d2) || 1;
          const pull = 7 * infl * infl;
          p.vx -= (dx / d) * pull;
          p.vy -= (dy / d) * pull;
          p.vx += (-dy / d) * pull * 0.75;
          p.vy += (dx / d) * pull * 0.75;
        }

        p.vx *= 0.86; p.vy *= 0.86;
        p.vx = Math.max(-18, Math.min(18, p.vx));
        p.vy = Math.max(-18, Math.min(18, p.vy));
        p.x += p.vx; p.y += p.vy;
      }

      const wobble = reduce ? 0 : 1.5;
      const x = p.x + Math.sin(now * 0.0011 + p.phase) * wobble;
      const y = p.y + Math.cos(now * 0.0009 + p.phase * 1.4) * wobble;
      const twinkle = reduce ? 1 : 0.8 + 0.2 * Math.sin(now * 0.0022 + p.phase * 3);
      ctx.globalAlpha = p.a * twinkle * fade;
      ctx.fillStyle = p.c;
      ctx.fillText(p.ch, x, y);
    }

    if (!reduce) {
      while (sparkCursor < letters.length && now >= letters[sparkCursor].t) {
        const L = letters[sparkCursor++];
        addSparks(L.x, L.y, now, 10, 170, 1000);
      }
      if (now >= nextAmbient && sparkCursor > 0) {
        const L = letters[(Math.random() * sparkCursor) | 0];
        addSparks(L.x, L.y, now, 2, 110, 800);
        nextAmbient = now + 260 + Math.random() * 320;
      }
      if (!burstDone && now >= typingEnd + 280) {
        burst(now);
        for (let i = 0; i < 18; i++) {
          const L = letters[(Math.random() * letters.length) | 0];
          addHearts(L.x, L.y, now, 1);
        }
        burstDone = true;
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      const age = (now - s.born) / s.life;
      if (age >= 1) { sparks.splice(i, 1); continue; }
      s.vy += 240 * dt * s.g;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      const a = Math.pow(1 - age, 1.4) * (0.6 + 0.4 * Math.sin(now * 0.03 + s.phase));
      ctx.globalAlpha = a * fade;
      ctx.fillStyle = s.c;
      ctx.fillText(s.ch, s.x, s.y);
    }

    for (let i = flutter.length - 1; i >= 0; i--) {
      const h = flutter[i];
      const age = (now - h.born) / h.life;
      if (age >= 1) { flutter.splice(i, 1); continue; }
      h.vy += 22 * dt;
      h.vx *= 0.995;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      ctx.globalAlpha = (1 - age) * (0.55 + 0.45 * Math.sin(now * 0.004 + h.phase)) * fade;
      ctx.fillStyle = h.c;
      ctx.font = `${h.size}px ${FONT}`;
      ctx.fillText(h.ch, h.x, h.y);
    }
    ctx.font = `10px ${FONT}`;

    if (!reduce && pointerIn) {
      const r = holeR;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, r * 0.9, mouse.x, mouse.y, r * 3);
      g.addColorStop(0, 'rgba(126,240,192,0.30)');
      g.addColorStop(0.38, 'rgba(255,143,199,0.12)');
      g.addColorStop(1, 'rgba(255,143,199,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,241,208,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r + 0.75, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 180);
  });

  canvas.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    pointerIn = true;
  });
  canvas.addEventListener('pointerleave', () => {
    mouse.x = -1e4;
    mouse.y = -1e4;
    pointerIn = false;
  });
  window.addEventListener('pointerup', (e) => {
    pressing = false;
    if (e.pointerType && e.pointerType !== 'mouse') pointerIn = false;
  });
  window.addEventListener('pointercancel', () => { pressing = false; });
  window.addEventListener('blur', () => { pressing = false; });
  canvas.addEventListener('pointerdown', (e) => {
    pointerIn = true;
    pressing = true;
    pressAt = performance.now();
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (reduce) return;
    const now = performance.now();
    addHearts(e.clientX, e.clientY, now, 10);
    for (const p of particles) {
      if (now < p.reveal) continue;
      const dx = p.x - e.clientX, dy = p.y - e.clientY;
      const d = Math.hypot(dx, dy) || 1;
      const f = Math.min(28, 3000 / (d + 70));
      p.vx += (dx / d) * f;
      p.vy += (dy / d) * f;
    }
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
